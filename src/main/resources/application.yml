spring:
  application:
    name: product-api

  datasource:
    url: jdbc:h2:file:./data/productdb;AUTO_SERVER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  seed:
    enabled: ${APP_SEED_ENABLED:true}
  cors:
    allowed-origins: "${APP_CORS_ALLOWED_ORIGINS:*}"

logging:
  level:
    com.example.productapi: INFO
